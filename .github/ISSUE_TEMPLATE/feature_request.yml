name: Idea
description: Suggest something the server or the manager could do.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: What you'd like to do, and why it would help.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Any workaround you use now, if there is one.
