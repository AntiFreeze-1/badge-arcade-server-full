name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            server/requirements*.txt
            helper/requirements.txt
      # The same install users get (install.py works around netifaces on Windows)
      - name: Install packages
        run: |
          python install.py --packages
          pip install -r server/requirements-dev.txt
      - name: Server tests
        working-directory: server
        run: python -m pytest tests
      - name: SpotPass tool tests
        working-directory: spotpass-letter
        run: python -m pytest tests
      # The archive tests skip themselves here: they need Nintendo's files and a console's key
      - name: Custom badge tests
        working-directory: helper
        run: python -m pytest tests

  # How much of the project the tests run, shown on the workflow run's summary page
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements*.txt
            helper/requirements.txt
      - name: Install packages
        run: |
          python install.py --packages
          pip install -r server/requirements-dev.txt
      - name: Run every suite with coverage
        run: coverage run -m pytest
      - name: Report
        run: |
          coverage report
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
