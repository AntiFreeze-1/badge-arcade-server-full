name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/requirements*.txt
      # The same install users get (install.py works around netifaces on Windows)
      - name: Install packages
        run: |
          python install.py --packages
          pip install -r server/requirements-dev.txt
      - name: Server tests
        working-directory: server
        run: python -m pytest tests
      - name: SpotPass tool tests
        working-directory: spotpass-letter
        run: python -m pytest tests
