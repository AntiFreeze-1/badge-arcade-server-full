# Tool settings only: the project isn't installed as a package (see README.md).

[tool.ruff]
target-version = "py312"
line-length = 140
extend-exclude = ["server/mitm/mitmproxy-nintendo", "server/mitm/.venv"]

[tool.ruff.lint]
# Syntax errors and pyflakes (undefined names, unused imports and variables)
select = ["E9", "F"]
